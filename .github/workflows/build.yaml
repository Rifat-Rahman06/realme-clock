name: Build Realme X APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Setup V2 Android Embedding & Preserve Alarm Manager Code
        run: |
          # 1. Back up our custom Alarm Manager code (lib/ and pubspec.yaml)
          mkdir -p custom_backup
          cp -r lib custom_backup/lib
          cp pubspec.yaml custom_backup/pubspec.yaml

          # Back up custom native Kotlin and Manifest files
          if [ -f android/app/src/main/kotlin/com/example/realme_alarm_manager/MainActivity.kt ]; then
            cp android/app/src/main/kotlin/com/example/realme_alarm_manager/MainActivity.kt custom_backup/MainActivity.kt
          elif [ -f custom_native/MainActivity.kt ]; then
            cp custom_native/MainActivity.kt custom_backup/MainActivity.kt
          fi

          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            cp android/app/src/main/AndroidManifest.xml custom_backup/AndroidManifest.xml
          elif [ -f custom_native/AndroidManifest.xml ]; then
            cp custom_native/AndroidManifest.xml custom_backup/AndroidManifest.xml
          fi

          # 2. Generate official Flutter V2 Android embedding scaffolding
          flutter create --org com.example --project-name realme_alarm_manager . --platforms=android --overwrite

          # 3. CRITICAL: Restore our Custom Alarm Manager code (OVERWRITING the demo counter)
          rm -rf lib
          cp -r custom_backup/lib lib
          cp -f custom_backup/pubspec.yaml pubspec.yaml

          # 4. Restore custom Realme Clock Kotlin bridge & permissions
          mkdir -p android/app/src/main/kotlin/com/example/realme_alarm_manager
          if [ -f custom_backup/MainActivity.kt ]; then
            cp -f custom_backup/MainActivity.kt android/app/src/main/kotlin/com/example/realme_alarm_manager/MainActivity.kt
          fi
          if [ -f custom_backup/AndroidManifest.xml ]; then
            cp -f custom_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi

          # 5. Resolve dependencies
          flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: realme-x-alarm-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
